<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QUANTUM HANDS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: monospace;
    width: 100%;
    height: 100%;
  }
 
  #hud {
    position: fixed;
    top: 14px;
    left: 16px;
    color: #6c9;
    opacity: 0.5;
    text-shadow: 0 0 4px #0a3;
    pointer-events: none;
    font-size: 13px;
    letter-spacing: 1px;
    z-index: 30;
  }
 
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #101030 0%, #000 75%);
    z-index: 50;
  }
 
  #start button {
    background: transparent;
    color: #0ff;
    border: 1px solid #0ff;
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 14px;
    padding: 18px 36px;
    cursor: pointer;
    box-shadow: 0 0 10px #0ff inset, 0 0 16px #0ff;
    transition: box-shadow 0.2s ease;
  }
 
  #start button:hover {
    box-shadow: 0 0 20px #0ff inset, 0 0 30px #0ff, 0 0 46px #0ff;
  }
 
  #stage {
    position: fixed;
    inset: 0;
  }
 
  #cam, #fx, #draw {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
 
  #cam {
    transform: scaleX(-1);
  }
 
  #fx, #draw {
    mix-blend-mode: screen;
    pointer-events: none;
  }
 
  #themes {
    position: fixed;
    top: 14px;
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 30;
  }
 
  #themes button {
    background: transparent;
    color: #6c9;
    border: 1px solid rgba(108,204,153,0.4);
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 11px;
    padding: 6px 10px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s, box-shadow 0.2s;
  }
 
  #themes button:hover {
    opacity: 1;
  }
 
  #themes button.active {
    opacity: 1;
    box-shadow: 0 0 8px currentColor;
  }
</style>
</head>
<body>
 
  <div id="hud">QUANTUM HANDS // move your hands</div>
 
  <div id="themes">
    <button data-theme="toxic" class="active">Toxic</button>
    <button data-theme="fire">Fire</button>
    <button data-theme="ice">Ice</button>
    <button data-theme="rainbow">Rainbow</button>
  </div>
 
  <div id="start">
    <button id="activate">Activate Camera</button>
  </div>
 
  <div id="stage">
    <video id="cam" playsinline muted></video>
    <canvas id="fx"></canvas>
  </div>
 
  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
 
    const startEl = document.getElementById('start');
    const btn = document.getElementById('activate');
    const video = document.getElementById('cam');
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');
 
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
 
    const HAND_EDGES = [
      [0,1],[1,2],[2,3],[3,4],       // thumb
      [0,5],[5,6],[6,7],[7,8],       // index
      [5,9],[9,10],[10,11],[11,12],  // middle
      [9,13],[13,14],[14,15],[15,16],// ring
      [13,17],[17,18],[18,19],[19,20],// pinky
      [0,17]
    ];
    const TIP_IDS = [4, 8, 12, 16, 20];
 
    let handLandmarker = null;
    let t = 0;
 
    // --- color themes ---
    const THEMES = {
      toxic:   { hand: [130, 90],  ribbon: 110 },
      fire:    { hand: [15, 40],   ribbon: 25  },
      ice:     { hand: [195, 215], ribbon: 200 },
      rainbow: null // handled dynamically below
    };
    let currentTheme = 'toxic';
 
    function getHandHue(hi) {
      if (currentTheme === 'rainbow') {
        return (t * 40 + hi * 180) % 360;
      }
      return THEMES[currentTheme].hand[hi];
    }
 
    function getRibbonBaseHue() {
      if (currentTheme === 'rainbow') {
        return (t * 60) % 360;
      }
      return THEMES[currentTheme].ribbon;
    }
 
    document.querySelectorAll('#themes button').forEach(b => {
      b.addEventListener('click', () => {
        currentTheme = b.dataset.theme;
        document.querySelectorAll('#themes button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      });
    });
 
    function rand(a, b) { return a + Math.random() * (b - a); }
 
    async function initLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
    }
 
    async function activate() {
      startEl.remove();
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 1280, height: 720, facingMode: 'user' },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      await initLandmarker();
      requestAnimationFrame(loop);
    }
 
    btn.addEventListener('click', activate);
 
    function drawEdge(p1, p2, hue) {
      const passes = [
        { alpha: 0.08, width: 18, light: 40, sat: 70 },
        { alpha: 0.2,  width: 6,  light: 45, sat: 70 },
        { alpha: 0.5,  width: 1,  light: 55, sat: 60 }
      ];
      ctx.lineCap = 'round';
      for (const p of passes) {
        ctx.strokeStyle = `hsla(${hue},${p.sat}%,${p.light}%,${p.alpha})`;
        ctx.lineWidth = p.width;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }
 
    function drawPinchArc(p1, p2, hue) {
      ctx.strokeStyle = `hsla(${hue},60%,55%,0.5)`;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      const segs = 8;
      for (let i = 1; i < segs; i++) {
        const f = i / segs;
        const mx = p1.x + (p2.x - p1.x) * f + rand(-10, 10);
        const my = p1.y + (p2.y - p1.y) * f + rand(-10, 10);
        ctx.lineTo(mx, my);
      }
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }
 
    function drawRibbon(p1, p2, i) {
      const base = getRibbonBaseHue();
 
      // outer glow
      const hueOuter = base + Math.sin(t + i) * 30;
      ctx.strokeStyle = `hsla(${hueOuter},85%,55%,0.18)`;
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
 
      // glitchy core, 14 sub-segments
      const segs = 14;
      for (let s = 0; s < segs; s++) {
        if (Math.random() < 0.22) continue;
        const f0 = s / segs, f1 = (s + 1) / segs;
        const sx = p1.x + (p2.x - p1.x) * f0 + rand(-3, 3);
        const sy = p1.y + (p2.y - p1.y) * f0 + rand(-3, 3);
        const ex = p1.x + (p2.x - p1.x) * f1 + rand(-3, 3);
        const ey = p1.y + (p2.y - p1.y) * f1 + rand(-3, 3);
        const hueCore = base + rand(-10, 20);
        ctx.strokeStyle = `hsla(${hueCore},95%,${rand(65, 90)}%,${rand(0.75, 1.0)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.stroke();
      }
 
      // chromatic ghost
      if (Math.random() < 0.25) {
        const off = Math.random() < 0.5 ? 3 : -3;
        ctx.strokeStyle = `hsla(${60 + rand(0, 30)},95%,70%,0.55)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p1.x + off, p1.y);
        ctx.lineTo(p2.x + off, p2.y);
        ctx.stroke();
      }
    }
 
    function loop() {
      t += 0.016;
      const w = canvas.width, h = canvas.height;
 
      // fade trails
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
 
      if (handLandmarker && video.readyState >= 2) {
        const result = handLandmarker.detectForVideo(video, performance.now());
        const allTips = [];
 
        if (result.landmarks) {
          result.landmarks.forEach((lm, hi) => {
            const hue = getHandHue(hi);
            const pts = lm.map(p => ({ x: (1 - p.x) * w, y: p.y * h }));
 
            // skeleton
            for (const [a, b] of HAND_EDGES) {
              drawEdge(pts[a], pts[b], hue);
            }
 
            // joints
            ctx.fillStyle = `hsla(${hue},60%,50%,0.5)`;
            for (const p of pts) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
              ctx.fill();
            }
 
            // fingertip glow orbs
            for (const id of TIP_IDS) {
              const p = pts[id];
              allTips.push(p);
              const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 32);
              grad.addColorStop(0, `hsla(${hue},60%,55%,0.45)`);
              grad.addColorStop(0.5, `hsla(${hue},70%,40%,0.2)`);
              grad.addColorStop(1, `hsla(${hue},70%,30%,0)`);
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(p.x, p.y, 32, 0, Math.PI * 2);
              ctx.fill();
            }
 
            // glitchy dots
            for (let i = 0; i < 14; i++) {
              const anchor = pts[Math.floor(Math.random() * 21)];
              const dist = 8 + Math.random() * 70;
              const ang = Math.random() * Math.PI * 2;
              const x = Math.round(anchor.x + Math.cos(ang) * dist);
              const y = Math.round(anchor.y + Math.sin(ang) * dist);
 
              let size;
              if (Math.random() < 0.15) size = 3;
              else if (Math.random() < 0.5) size = 2;
              else size = 1;
 
              const hh = hue + (Math.random() * 30 - 15);
              const light = rand(40, 65);
              const alpha = rand(0.3, 0.7);
              ctx.fillStyle = `hsla(${hh},60%,${light}%,${alpha})`;
              ctx.fillRect(x, y, size, size);
            }
 
            // pinch detection
            const dx = pts[4].x - pts[8].x, dy = pts[4].y - pts[8].y;
            if (Math.hypot(dx, dy) < 50) {
              drawPinchArc(pts[4], pts[8], hue);
            }
          });
        }
 
        // inter-hand ribbons
        if (allTips.length >= 10) {
          for (let i = 0; i < 5; i++) {
            drawRibbon(allTips[i], allTips[i + 5], i);
          }
        }
      }
 
      requestAnimationFrame(loop);
    }
  </script>
 
</body>
</html>
